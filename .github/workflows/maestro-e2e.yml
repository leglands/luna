name: Maestro E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  maestro-android:
    name: "Maestro — Android E2E (7 flows)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          targets: x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            luna-core/target
          key: ${{ runner.os }}-maestro-${{ hashFiles('**/Cargo.lock') }}

      - name: Build native library (x86_64 for emulator)
        run: |
          cd luna-core
          cargo ndk --target x86_64-linux-android --platform 26 -- build --release

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro E2E flows
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 6
          script: |
            adb install android-app/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/ --format junit --output maestro-results.xml

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maestro-results
          path: maestro-results.xml
