name: Luna SEO static validation

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/seo-static.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/seo-static.yml'

permissions:
  contents: read

jobs:
  seo-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --legacy-peer-deps
      - run: cd web && npm run test:seo
