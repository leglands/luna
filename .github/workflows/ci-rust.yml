name: LUNA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── 1. Rust core: unit + behavior tests ───────────────────────────────────
  rust-tests:
    name: "Rust — Tests + Lint + Audit"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            luna-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit + cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo fmt check
        run: cargo fmt --manifest-path luna-core/Cargo.toml -- --check

      - name: cargo clippy (zero warnings)
        run: cargo clippy --manifest-path luna-core/Cargo.toml --all-targets -- -D warnings

      - name: "cargo test — unit + behavior (79 tests)"
        run: cargo test --manifest-path luna-core/Cargo.toml --all-features

      - name: cargo audit (known CVEs)
        run: cargo audit --file luna-core/Cargo.lock

      - name: cargo deny (licenses + advisories)
        run: cargo deny --manifest-path luna-core/Cargo.toml check

  # ─── 2. iOS build + XCTest ─────────────────────────────────────────────────
  ios-build:
    name: "iOS — Build + XCTest"
    runs-on: macos-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            luna-core/target
          key: ${{ runner.os }}-ios-${{ hashFiles('**/Cargo.lock') }}

      - name: Build iOS device (arm64)
        run: cargo build --manifest-path luna-core/Cargo.toml --release --target aarch64-apple-ios

      - name: Build iOS simulator (arm64)
        run: cargo build --manifest-path luna-core/Cargo.toml --release --target aarch64-apple-ios-sim

      - name: Install xcodegen + xcpretty
        run: brew install xcodegen xcpretty

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Generate UniFFI Swift bindings
        run: |
          cargo install uniffi-bindgen-cli --locked
          uniffi-bindgen-cli generate \
            --library luna-core/target/aarch64-apple-ios-sim/release/libluna_core.dylib \
            --language swift \
            --out-dir ios-app/LunaApp/Generated/

      - name: XCTest — LunaTests
        run: |
          xcodebuild test \
            -project ios-app/LunaApp.xcodeproj \
            -scheme LunaApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -only-testing LunaTests \
            | xcpretty --color

      - name: XCUITest — LunaUITests (User Journeys)
        run: |
          xcodebuild test \
            -project ios-app/LunaApp.xcodeproj \
            -scheme LunaApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -only-testing LunaUITests \
            | xcpretty --color

  # ─── 3. Android build + JUnit ──────────────────────────────────────────────
  android-build:
    name: "Android — Build + JUnit"
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            luna-core/target
          key: ${{ runner.os }}-android-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Android native libraries
        run: |
          cd luna-core
          cargo ndk \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android \
            --platform 26 -- build --release

      - name: Android JUnit tests
        working-directory: android-app
        run: ./gradlew :app:testDebugUnitTest

      - name: Android Espresso tests (instrumented)
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 6
          script: cd android-app && ./gradlew :app:connectedAndroidTest

  # ─── 4. i18n completeness check ────────────────────────────────────────────
  i18n-check:
    name: "i18n — Shipped locale completeness"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check README translations (must be 41 files + main)
        run: |
          count=$(ls docs/i18n/README_*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $count language READMEs"
          [ "$count" -ge 41 ] || (echo "FAIL: expected 41 translations, found $count" && exit 1)
      - name: Run i18n key completeness checker
        run: python3 scripts/check_i18n.py
