name: Luna SEO live validation

on:
  workflow_run:
    workflows: ["Deploy Luna Web"]
    types: [completed]

permissions:
  contents: read

jobs:
  seo-live:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: bash tests/seo-live.sh
