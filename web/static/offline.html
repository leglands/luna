<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Luna</title>
  <style>
    :root {
      --brand: #6B3FA0;
      --bg: #f8f9fb;
      --text: #1a1a2e;
      --muted: #6b7280;
      --surface: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --surface: #1e293b;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .card {
      max-width: 340px;
      width: 100%;
      background: var(--surface);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
    }
    .icon {
      color: var(--brand);
      margin-bottom: 1.25rem;
      opacity: 0.85;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 24px 28px 26px 22px;
      padding: 0.875rem 2.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 44px;
      font-family: inherit;
      letter-spacing: 0.01em;
      transition: opacity 120ms, transform 120ms;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); opacity: 0.85; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <line x1="2" y1="2" x2="22" y2="22"/>
  <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
  <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
  <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
  <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
  <path d="M5 12.55a10 10 0 0 1 5.17-2.39"/>
  <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
</svg></div>
    <h1 id="t"></h1>
    <p id="b"></p>
    <button onclick="window.location.reload()" id="btn"></button>
  </div>

      document.documentElement.dir = 'rtl';
      document.getElementById('card').style.textAlign = 'right';

    if (theme) document.documentElement.setAttribute('data-theme', theme);

</html>
