<!doctype html>
<html lang="en" data-app="luna">
	<head>
		<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Luna — Cycle & Wellness</title>
	<link rel="stylesheet" href="%sveltekit.assets%/tokens.css" />
<script>(function(){var s=localStorage.getItem("life-theme");var d=window.matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",s||(d?"dark":"light"));})();</script>
	%sveltekit.head%
			<!-- Icons & PWA -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" content="#D4678A" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Luna" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
